# Attach bare script + .deb to GitHub Releases (SYS-6).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb
        run: make deb

      - name: Verify package
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' <VERSION)
          DEB="dist/sysz_${VERSION}_all.deb"
          test -f "$DEB"
          dpkg-deb -f "$DEB" Depends | grep -E 'fzf'

      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sysz
            dist/*.deb
