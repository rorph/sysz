name: lint

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sh-checker
        uses: luizm/action-sh-checker@master
        with:
          sh_checker_exclude: "README.sh"
